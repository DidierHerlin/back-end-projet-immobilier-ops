name: CI - DRF

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: app_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d app_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SECRET_KEY: test-secret-key
      DEBUG: "True"
      DB_NAME: app_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      TIME_ZONE: UTC
      ACCESS_TOKEN_LIFETIME_MIN: "30"
      REFRESH_TOKEN_LIFETIME_DAYS: "7"
      FRONTEND_URL: http://localhost:3000
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      DEFAULT_FROM_EMAIL: noreply@local.test

    defaults:
      run:
        working-directory: ./configuration

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérifier les migrations / configuration Django
        run: python manage.py check

      - name: Lancer les tests Django
        run: python manage.py test

  code-quality:
    needs: backend-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier que les secrets SonarQube sont configurés
        run: |
          MISSING=0
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "::error::Le secret SONAR_TOKEN est vide ou absent. Va sur https://sonarcloud.io/account/security pour en générer un, puis ajoute-le dans Settings > Secrets and variables > Actions."
            MISSING=1
          fi
          if [ -z "${{ secrets.SONAR_HOST_URL }}" ]; then
            echo "::error::Le secret SONAR_HOST_URL est vide ou absent. Sa valeur doit être exactement : https://sonarcloud.io"
            MISSING=1
          fi
          if [ -z "${{ secrets.SONAR_PROJECT_KEY }}" ]; then
            echo "::error::Le secret SONAR_PROJECT_KEY est vide ou absent. Récupère-le dans l'URL de ton projet sur sonarcloud.io (paramètre ?id=...)."
            MISSING=1
          fi
          if [ "$MISSING" = "1" ]; then
            echo "::error::Un ou plusieurs secrets SonarQube sont manquants. Le job s'arrête ici avec un message clair au lieu de l'erreur cryptique du scanner."
            exit 1
          fi
          echo "Tous les secrets SonarQube sont bien configurés."

      - name: Analyse SonarQube
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: ./configuration
          args: >-
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
            -Dsonar.sources=.
            -Dsonar.python.version=3.11

  docker-publish:
    needs: [backend-tests, code-quality]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image name
        if: github.event_name == 'push'
        run: echo "IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/immobilier-drf" >> $GITHUB_ENV

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./configuration
          file: ./configuration/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Build image only on PR
        if: github.event_name == 'pull_request'
        run: docker build -t immobilier-drf:pr ./configuration